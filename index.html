<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Mahasiswa - Tugas 6</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Form Registrasi -->
        <div class="card form-card">
            <h2>Registrasi Mahasiswa</h2>
            
            <form id="form-registrasi">
                <div class="form-group">
                    <label>Nama Mahasiswa</label>
                    <input type="text" id="nama" placeholder="Masukkan Nama" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Email Aktif" required>
                </div>

                <div class="form-group">
                    <label>NRP</label>
                    <input type="text" id="nrp" placeholder="Masukkan NRP" required>
                </div>

                <div class="form-group">
                    <label>Mata Kuliah</label>
                    <input type="text" id="matkul" placeholder="Masukkan Mata Kuliah" required>
                </div>

                <div class="form-group">
                    <label>Dosen Pengampu</label>
                    <input type="text" id="dosen" placeholder="Masukkan Nama Dosen" required>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="card nav-card">
            <a href="index.html" class="btn-nav active">Registrasi</a>
            <a href="kodepos.html" class="btn-nav">Kode Pos</a>
            <a href="latihan.html" class="btn-nav">Dropdown</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
