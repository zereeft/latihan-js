<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode Pos Indonesia - Tugas 6</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Card Utama -->
        <div class="card form-card" style="padding: 0; overflow: hidden;">
            <!-- Header Biru Muda -->
            <div class="card-header">
                <h2>Kode Pos Indonesia</h2>
            </div>
            
            <!-- Body Form -->
            <div class="card-body">
                <form id="form-kodepos">
                    
                    <div class="form-group">
                        <label>Provinsi</label>
                        <select id="provinsi" required>
                            <option value="">Pilih Provinsi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Kota atau Kabupaten</label>
                        <select id="kota" disabled required>
                            <option value="">Pilih Kota atau Kabupaten</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Kecamatan</label>
                        <select id="kecamatan" disabled required>
                            <option value="">Pilih Kecamatan</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Submit</button>
                </form>
            </div>
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="card nav-card">
            <a href="index.html" class="btn-nav">Registrasi</a>
            <a href="kodepos.html" class="btn-nav active">Kode Pos</a>
            <a href="latihan.html" class="btn-nav">Dropdown</a>
        </div>
    </div>

    <!-- Panggil file JS khusus kode pos -->
    <script src="js/kodepos.js"></script>
</body>
</html>
